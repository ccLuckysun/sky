# =====================================================================
#  nginx for macOS  ——  苍穹外卖 / 瑞吉外卖  管理端
# ---------------------------------------------------------------------
#  前端静态资源 : /Users/cc/Desktop/waimai/frontend/nginx-1.20.2/html/sky
#  后端服务     : http://127.0.0.1:8080   (Spring Boot, sky-take-out)
#  管理端访问   : http://localhost
#
#  测试配置 : sudo nginx -c /Users/cc/Desktop/waimai/frontend/nginx-mac.conf -t
#  启动     : sudo nginx -c /Users/cc/Desktop/waimai/frontend/nginx-mac.conf
#  重载     : sudo nginx -c /Users/cc/Desktop/waimai/frontend/nginx-mac.conf -s reload
#  停止     : sudo nginx -c /Users/cc/Desktop/waimai/frontend/nginx-mac.conf -s stop
#
#  注意：listen 80 属于特权端口(<1024)，必须 sudo 启动。
#        若不想用 sudo，把下面 listen 改成 8081，命令去掉 sudo，
#        访问地址变成 http://localhost:8081 。后端 8080 不受影响。
# =====================================================================

worker_processes  1;

# 关键：worker 必须以当前用户跑。
# 默认是 nobody，而 /Users/cc 是 drwxr-x---、~/Desktop 是 drwx------，
# nobody 进不去，会 stat() 失败(13: Permission denied)，
# 再被下面的 try_files 回退成 /index.html 形成重定向环 → 首页 500。
# 只有 master 以 root 启动时该指令才生效（所以仍需 sudo）。
user  cc staff;

# 用绝对路径，避免和 Homebrew 默认配置(prefix)混淆
error_log  /opt/homebrew/var/log/nginx/error.log;
pid        /opt/homebrew/var/log/nginx/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # WebSocket 需要：有 Upgrade 头就转发，否则 close
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        server_name  localhost;

        # nginx 默认只收 1m 的请求体，而前端上传组件允许单张图片 2M：
        # 1m~2m 的图会被 nginx 直接 413，后端 multipart 限制和异常处理器根本不会执行，
        # 排查时会被引向后端，方向全错。取值不小于后端的 max-request-size。
        client_max_body_size 10m;

        # ---------------- 前端静态资源 ----------------
        location / {
            root   /Users/cc/Desktop/waimai/frontend/nginx-1.20.2/html/sky;
            index  index.html index.htm;
            # Vue history 路由：刷新 /dashboard 这类地址时回退到 index.html，
            # 否则会 404（原 Windows 配置没有这行，是个坑）
            try_files $uri $uri/ /index.html;
        }

        # ---------------- 上传的图片 ----------------
        # 由后端的静态资源映射提供（映射到 sky-server/uploads，不在这里再写一遍绝对路径）
        location /uploads/ {
            proxy_pass http://127.0.0.1:8080;   # 不带 URI，保留 /uploads 前缀；写成 ...:8080/ 会把前缀剥掉导致全部 404
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ---------------- 管理端接口 ----------------
        # 前端 app.js 里 baseURL = "/api"，这里映射到后端的 /admin/
        # 用 127.0.0.1 而不是 localhost：localhost 可能先解析成 IPv6 ::1，
        # 而 Spring Boot 的 Tomcat 默认只监听 IPv4，会 502
        location /api/ {
            proxy_pass http://127.0.0.1:8080/admin/;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        }

        # ---------------- 用户端接口 ----------------
        location /user/ {
            proxy_pass http://127.0.0.1:8080/user/;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        }

        # ---------------- WebSocket (来单提醒 / 客户催单) ----------------
        location /ws/ {
            proxy_pass http://127.0.0.1:8080/ws/;
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
        }
    }
}

server:
  port: 8080
  tomcat:
    # 请求体超过这个值时 Tomcat 不再读完 body 直接断连，客户端只会看到 ERR_CONNECTION_RESET、
    # 拿不到下面那个"文件过大"的 JSON。不能写 -1：Boot 的 DataSize 不接受负数，会让应用起不来。
    max-swallow-size: 10MB

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  servlet:
    multipart:
      # 前端上传组件限制单张图片 2M，这里必须不小于 2；Spring Boot 默认只有 1M，
      # 不改的话 1M~2M 的图片会直接上传失败
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  redis:
    # 前缀必须是 spring.redis.*：本项目是 Boot 2.7.3，换成 3.x 的 spring.data.redis.*
    # 整块会被**静默忽略**（不报错、不警告），连接退回 localhost:6379 的默认值——
    # 在本机恰好是对的，所以这个错本地永远测不出来，一上服务器才炸。
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    # 本机 Redis 未开访问控制，这一项就是空的。写成带空串默认值的占位符，是因为
    # dev 那边无论写 `password:`（YAML 解析成 null）还是干脆不写，${} 都能解析到 ""，
    # 不会出现 "Could not resolve placeholder" 把应用拦在启动阶段。空串经
    # RedisPassword.of 归一成 none()，Lettuce 不发 AUTH（发了会得到
    # ERR Client sent AUTH, but no password is set）。
    password: ${sky.redis.password:}
    # 0 号库是 Redis 默认库（本机 CONFIG GET databases = 16 个库，keyspace 全空）。
    database: ${sky.redis.database}
    # 不写 spring.redis.lettuce.pool.*：连接池要 classpath 上有 commons-pool2 才生效，
    # 本项目没引它，配了会启动失败。默认的 Lettuce 共享原生连接对本项目足够。

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  upload:
    # 上传文件的存放目录，不写绝对路径：相对路径会以 sky-server 模块目录为基准解析，
    # 项目整体搬到别的路径、换机器克隆后都不用改这里（解析逻辑见 UploadConfiguration）。
    # 该目录由 WebMvcConfiguration.addResourceHandlers 注册为静态资源；本项目继承了
    # WebMvcConfigurationSupport，spring.web.resources.* 已整体退避，配了也不生效。
    dir: uploads
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
